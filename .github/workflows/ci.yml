# Runs tests and a production build on every push/PR. Does not deploy (Vercel handles deploys from the connected repo).
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
